modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/RunelessRPG-Mana-Bridge/issues"

# Adapter for Iron's Spells 'n Spellbooks: only loaded while Iron's is installed
[[mixins]]
config="${mod_id}.irons_spellbooks.mixins.json"
requiredMods=["irons_spellbooks"]

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/RunelessRPG-Mana-Bridge"
authors="${mod_authors}"
description='''${mod_description}'''
credits="Compatibility mod for RunelessRPG, Spell Engine and Iron's Spells 'n Spellbooks; not made by or affiliated with the authors of Spell Engine or Iron's Spells 'n Spellbooks. No files of other mods are bundled. See CREDITS.md in the source repository."
logoFile="runelessrpg_bridge_logo.png"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # The shared mana pool runs through the RunelessRPG API (brings Spell Engine)
    modId="runelessrpg"
    type="required"
    versionRange="${runelessrpg_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: Iron's Spells 'n Spellbooks mana joins the shared pool
    modId="irons_spellbooks"
    type="optional"
    versionRange="${irons_spellbooks_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: Ars Nouveau mana joins the shared pool
    modId="ars_nouveau"
    type="optional"
    versionRange="${ars_nouveau_version_range}"
    ordering="AFTER"
    side="BOTH"
